function countUp(scope){
  scope.querySelectorAll('[data-count]').forEach(function(el){
    var to=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec||'0',10);
    var fmt=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    if(reduced){el.textContent=fmt.format(to);return;}
    /* reserva a largura do valor final: sem isso o texto vizinho se reorganiza a cada quadro e a tela "treme" */
    el.textContent=fmt.format(to); if(getComputedStyle(el).display==='inline') el.style.display='inline-block'; el.style.minWidth=''; var wv=el.getBoundingClientRect().width; if(wv>0){ el.style.minWidth=Math.ceil(wv)+'px'; }
    var t0=null,dur=1900,delay=450;el.textContent=fmt.format(0);
    var tok=(el._tok||0)+1;el._tok=tok;
    function step(ts){ if(el._tok!==tok) return; if(!t0)t0=ts; var p=Math.min(1,Math.max(0,(ts-t0-delay)/dur)); var e=1-Math.pow(2,-10*p); if(p>=1)e=1; el.textContent=fmt.format(to*e); if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
    /* garantia: se o navegador pausar rAF (aba/janela em segundo plano), mostra o valor final */
    setTimeout(function(){ if(el._tok===tok){ el._tok++; el.textContent=fmt.format(to); } }, delay+dur+400);
  });
  scope.querySelectorAll('[data-ring]').forEach(function(c){c.style.strokeDashoffset=String(100-parseFloat(c.dataset.ring));});
}
function resetCounts(scope){scope.querySelectorAll('[data-ring]').forEach(function(c){c.style.strokeDashoffset='100';});}

function setOrbit(s){
  var o=(s.dataset.orbit||'30%,0%,-14deg,1,.5').split(',');
  /* o arco decorativo só aparece em aberturas de capítulo: em telas de conteúdo ele disputava com o texto */
  var show=s.classList.contains('opener');
  orbit.style.setProperty('--ox',o[0]);orbit.style.setProperty('--oy',o[1]);orbit.style.setProperty('--or',o[2]);orbit.style.setProperty('--os',o[3]);orbit.style.setProperty('--oo',show?o[4]:'0');
}
function setChrome(i){
  var s=slides[i];
  body.dataset.theme=s.dataset.theme;
  $('cNow').textContent=String(i+1).padStart(2,'0');
  $('chapLabel').innerHTML='<b></b>';$('chapLabel').firstChild.textContent=s.dataset.chapter;
  $('progBar').style.setProperty('--p',N>1?i/(N-1):1);
  chapters.forEach(function(c){c.btn.classList.toggle('cur-ch',i>=c.start&&i<c.start+c.count);});
}

function go(n,opts){
  if(scrollMode){ n=Math.max(0,Math.min(N-1,n)); slides[n].scrollIntoView({behavior:reduced?'auto':'smooth'}); return; }
  n=Math.max(0,Math.min(N-1,n));
  if(n===cur) return;
  var dir=n>cur?1:-1, prev=slides[cur], next=slides[n];
  doc.getElementById('deck').style.setProperty('--dir',dir);
  slides.forEach(function(s){s.style.setProperty('--dir',dir);});
  if(prev){prev.classList.remove('is-active');prev.classList.add('is-leaving');prev.setAttribute('inert','');prev.setAttribute('aria-hidden','true');resetCounts(prev);
    (function(p){setTimeout(function(){if(!p.classList.contains('is-active'))p.classList.remove('is-leaving');},1300);})(prev);}
  next.style.setProperty('--mx',(lastPt.x*100)+'%');next.style.setProperty('--my',(lastPt.y*100)+'%');
  next.classList.remove('is-leaving');
  void next.offsetWidth;
  next.classList.add('is-active');next.removeAttribute('inert');next.removeAttribute('aria-hidden');
  cur=n;
  setChrome(n);setOrbit(next);countUp(next);onEnter(next);
  $('live').textContent='Tela '+(n+1)+' de '+N+': '+(next.dataset.title||'');
  try{history.replaceState(null,'','#s'+(n+1));}catch(e){}
  lockUntil=Date.now()+(opts&&opts.instant?0:850);
}
function nav(d){ if(Date.now()<lockUntil) return; go(cur+d); }

/* agenda truck */
var truckRaf=0;
function onEnter(s){
  var route=s.querySelector('.route');
  if(route && !scrollMode){
    var path=route.querySelector('#routePath'),truck=route.querySelector('.truck');
    if(!path||!truck||reduced) return;
    cancelAnimationFrame(truckRaf);
    var L=path.getTotalLength(),t0=null,dur=6200,delay=1100;
    function f(ts){
      if(!s.classList.contains('is-active')){truck.style.opacity=0;return;}
      if(!t0)t0=ts;var p=Math.min(1,Math.max(0,(ts-t0-delay)/dur));
      var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      var pt=path.getPointAtLength(e*L),w=route.clientWidth,h=route.clientHeight,tw=truck.offsetWidth;
      truck.style.transform='translate('+(pt.x/1000*w-tw/2)+'px,'+(pt.y/400*h-tw*.95)+'px)';
      truck.style.opacity=(p>0&&p<1)?1:0;
      if(p<1)truckRaf=requestAnimationFrame(f);
    }
    truckRaf=requestAnimationFrame(f);
  }
}

/* ---------- mode (deck vs scroll) ---------- */
var io=null, mq=matchMedia('(max-width: 820px)');
function applyMode(){
  scrollMode=mq.matches;
  body.classList.toggle('mode-scroll',scrollMode);
  if(scrollMode){
    slides.forEach(function(s){s.removeAttribute('inert');s.removeAttribute('aria-hidden');s.classList.remove('is-leaving');});
    if(!io){
      io=new IntersectionObserver(function(es){
        es.forEach(function(en){
          var s=en.target,i=slides.indexOf(s);
          if(en.isIntersecting){ if(!s.classList.contains('is-active')){s.classList.add('is-active');countUp(s);} }
          if(en.intersectionRatio>0.35 || (en.isIntersecting && en.boundingClientRect.top<innerHeight*.4 && en.boundingClientRect.bottom>innerHeight*.4)){cur=i;setChrome(i);}
        });
      },{threshold:[0,.15,.35,.6]});
    }
    slides.forEach(function(s){io.observe(s);});
  } else {
    if(io){io.disconnect();}
    var keep=cur<0?0:cur;cur=-1;
    slides.forEach(function(s){s.classList.remove('is-active');s.setAttribute('inert','');s.setAttribute('aria-hidden','true');});
    go(keep,{instant:true});
  }
}

/* ---------- input ---------- */
$('prevB').addEventListener('click',function(){go(cur-1);});
$('nextB').addEventListener('click',function(){go(cur+1);});
doc.querySelectorAll('[data-go="next"]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();go(cur+1);});});
doc.querySelectorAll('[data-goto]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var t=doc.getElementById(b.dataset.goto);if(t)go(slides.indexOf(t));});});

addEventListener('keydown',function(e){
  if(lbOpen){ if(e.key==='Escape')closeLb(); else if(e.key==='ArrowRight')stepLb(1); else if(e.key==='ArrowLeft')stepLb(-1); else if(e.key==='Tab')trap(e,$('lb')); return; }
  if(menuOpen){ if(e.key==='Escape'||e.key==='m'||e.key==='M')closeMenu(); else if(e.key==='Tab')trap(e,$('menu')); return; }
  var z=e.target.closest&&e.target.closest('[data-zoom]');
  if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openLb(z);return;}
  if(e.target.closest&&e.target.closest('button,a,input,textarea')&&(e.key===' '||e.key==='Enter')) return;
  if(e.key==='m'||e.key==='M'){openMenu();return;}
  if(scrollMode) return;
  var k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Spacebar'){e.preventDefault();nav(1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();nav(-1);}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(N-1);}
});
var wheelAcc=0,wheelT=0;
addEventListener('wheel',function(e){
  if(scrollMode||lbOpen||menuOpen) return;
  var sc=e.target.closest&&e.target.closest('.gantt,.scrollable');
  if(sc&&sc.scrollWidth>sc.clientWidth&&Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
  e.preventDefault();
  var now=Date.now(); if(now-wheelT>220) wheelAcc=0; wheelT=now;
  wheelAcc+=(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX);
  if(Math.abs(wheelAcc)>46 && now>lockUntil){ var d=wheelAcc>0?1:-1; wheelAcc=0; go(cur+d); lockUntil=Date.now()+1150; }
},{passive:false});
var tx=0,ty=0,tt=0;
addEventListener('touchstart',function(e){if(scrollMode||lbOpen)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();},{passive:true});
addEventListener('touchend',function(e){
  if(lbOpen){var dx0=e.changedTouches[0].clientX-tx;if(Math.abs(dx0)>50)stepLb(dx0<0?1:-1);return;}
  if(scrollMode||menuOpen)return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Date.now()-tt>800)return;
  if(Math.max(Math.abs(dx),Math.abs(dy))>50){ go(cur+((Math.abs(dx)>Math.abs(dy)?dx:dy)<0?1:-1)); }
},{passive:true});
addEventListener('touchstart',function(e){if(lbOpen){tx=e.touches[0].clientX;}},{passive:true});
$('deck').addEventListener('click',function(e){
  if(scrollMode) return;
  if(e.target.closest('a,button,[data-zoom],input,label,.copy,.pt')) return;
  var sel=getSelection&&getSelection().toString(); if(sel) return;
  lastPt={x:e.clientX/innerWidth,y:e.clientY/innerHeight};
  if(e.clientX<innerWidth*.18) go(cur-1); else go(cur+1);
});

/* ---------- menu ---------- */
var menuOpen=false,lastFocus=null;
function openMenu(){menuOpen=true;lastFocus=doc.activeElement;$('menu').classList.add('open');$('menu').setAttribute('aria-hidden','false');$('menuBtn').setAttribute('aria-expanded','true');setTimeout(function(){var c=ml.querySelector('.cur-ch')||ml.querySelector('button');c&&c.focus();},60);}
function closeMenu(){menuOpen=false;$('menu').classList.remove('open');$('menu').setAttribute('aria-hidden','true');$('menuBtn').setAttribute('aria-expanded','false');lastFocus&&lastFocus.focus&&lastFocus.focus();}
$('menuBtn').addEventListener('click',function(){menuOpen?closeMenu():openMenu();});
$('menuClose').addEventListener('click',closeMenu);
function trap(e,box){var f=box.querySelectorAll('button:not([hidden]),a[href]');if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&doc.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&doc.activeElement===z){e.preventDefault();a.focus();}}

/* ---------- lightbox ---------- */
var lbOpen=false,lbItems=[],lbIdx=0,lbFocus=null;
function openLb(el){
  var g=el.dataset.gallery;lbItems=Array.prototype.slice.call(doc.querySelectorAll('[data-zoom]')).filter(function(x){return g?x.dataset.gallery===g:x===el;});
  lbIdx=lbItems.indexOf(el);lbFocus=doc.activeElement;renderLb();
  lbOpen=true;$('lb').classList.add('open');$('lb').setAttribute('aria-hidden','false');
  $('lbPrev').hidden=$('lbNext').hidden=lbItems.length<2;
  setTimeout(function(){$('lbClose').focus();},50);
}
function renderLb(){
  var el=lbItems[lbIdx],st=$('lbStage');st.innerHTML='';
  var img=el.querySelector('img');
  if(img){var im=new Image();im.src=img.currentSrc||img.src;im.alt=img.alt;st.appendChild(im);}
  else{
    var m=el.querySelector('.mock');if(m){
      var c=m.cloneNode(true);c.style.transform='none';c.style.transformOrigin='0 0';
      var holder=doc.createElement('div');holder.style.position='relative';holder.appendChild(c);st.appendChild(holder);
      var w=c.offsetWidth,h=c.offsetHeight,s=Math.min(innerWidth*.88/w,innerHeight*.78/h,2.4);
      c.style.transform='scale('+s+')';holder.style.width=(w*s)+'px';holder.style.height=(h*s)+'px';
    }
  }
  $('lbCap').textContent=(el.dataset.caption||'')+(lbItems.length>1?'  ·  '+(lbIdx+1)+' / '+lbItems.length:'');
}
function stepLb(d){if(lbItems.length<2)return;lbIdx=(lbIdx+d+lbItems.length)%lbItems.length;renderLb();}
function closeLb(){lbOpen=false;$('lb').classList.remove('open');$('lb').setAttribute('aria-hidden','true');lbFocus&&lbFocus.focus&&lbFocus.focus();}
doc.querySelectorAll('[data-zoom]').forEach(function(el){el.addEventListener('click',function(e){e.stopPropagation();openLb(el);});});
$('lbClose').addEventListener('click',closeLb);
$('lbPrev').addEventListener('click',function(e){e.stopPropagation();stepLb(-1);});
$('lbNext').addEventListener('click',function(e){e.stopPropagation();stepLb(1);});
$('lb').addEventListener('click',function(e){if(e.target===$('lb')||e.target===$('lbStage'))closeLb();});

/* ---------- cronograma: semana selecionada (clique, foco ou hover) ---------- */
doc.querySelectorAll('.wk').forEach(function(w){
  var nodes=Array.prototype.slice.call(w.querySelectorAll('.wk-n'));
  var pNo=w.querySelector('.wk-p-no'),pFo=w.querySelector('.wk-p-fo'),pDe=w.querySelector('.wk-p-de');
  function sel(n){
    nodes.forEach(function(x){var on=x===n;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false');});
    if(pNo){
      pNo.textContent=n.querySelector('.no').textContent.replace('S','');pFo.textContent=n.querySelector('.fo').textContent;
      var de=n.querySelector('.de').cloneNode(true),ent=de.querySelector('.ent');if(ent)ent.remove();pDe.innerHTML=de.innerHTML;
      var box=w.querySelector('.wk-p-ent');
      if(box){var ul=box.querySelector('ul');ul.innerHTML='';
        if(ent){ent.textContent.replace(/^\s*Entregas?( aprovadas)?:\s*/i,'').replace(/\.\s*$/,'').split(' · ').forEach(function(x){var li=doc.createElement('li');li.textContent=x.charAt(0).toUpperCase()+x.slice(1);ul.appendChild(li);});box.classList.remove('empty');}
        else{box.classList.add('empty');}
      }
    }
  }
  nodes.forEach(function(n){
    n.addEventListener('click',function(e){e.stopPropagation();sel(n);});
    n.addEventListener('focus',function(){sel(n);});
    if(fine) n.addEventListener('mouseenter',function(){sel(n);});
  });
});

/* ---------- kit detalhado: material selecionado (clique, foco ou hover) ---------- */
doc.querySelectorAll('.kit2').forEach(function(k){
  var items=Array.prototype.slice.call(k.querySelectorAll('.kit-i')),panel=k.querySelector('.kit-panel');
  function sel(it){
    items.forEach(function(x){var on=x===it;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false');});
    if(panel) panel.innerHTML=it.querySelector('.kd').innerHTML;
  }
  items.forEach(function(it){
    it.addEventListener('click',function(e){e.stopPropagation();sel(it);});
    it.addEventListener('focus',function(){sel(it);});
    if(fine) it.addEventListener('mouseenter',function(){sel(it);});
  });
});

/* ---------- balões de fonte (mapa competitivo): hover, foco ou toque ---------- */
doc.querySelectorAll('.pt').forEach(function(p){
  p.addEventListener('click',function(e){
    if(e.target.closest('a')) return;
    e.stopPropagation();
    var was=p.classList.contains('open');
    doc.querySelectorAll('.pt.open').forEach(function(x){x.classList.remove('open');x.setAttribute('aria-expanded','false');});
    if(!was){p.classList.add('open');p.setAttribute('aria-expanded','true');}
  });
  p.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();p.click();}
    else if(e.key==='Escape'&&p.classList.contains('open')){e.stopPropagation();p.click();}
  });
});
doc.addEventListener('click',function(e){ if(!e.target.closest('.pt')) doc.querySelectorAll('.pt.open').forEach(function(x){x.classList.remove('open');x.setAttribute('aria-expanded','false');}); });
/* no celular os balões viram cartões fixos abaixo do mapa (fontes sempre visíveis) */
doc.querySelectorAll('.cmap-wrap').forEach(function(wr){
  var box=doc.createElement('div');box.className='cm-notes';
  wr.querySelectorAll('.pt .tip').forEach(function(t){var c=doc.createElement('div');c.className='cm-note';c.innerHTML=t.innerHTML;box.appendChild(c);});
  wr.appendChild(box);
});

/* ---------- copy ---------- */
doc.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(e){
  e.stopPropagation();var v=b.dataset.copy;
  function ok(){b.textContent='copiado';b.classList.add('copied');setTimeout(function(){b.textContent='copiar';b.classList.remove('copied');},1600);}
  function fallback(){var s=b.previousElementSibling;if(s){var r=doc.createRange();r.selectNodeContents(s);var se=getSelection();se.removeAllRanges();se.addRange(r);}}
  try{navigator.clipboard.writeText(v).then(ok,fallback);}catch(err){fallback();}
});});

/* ---------- cursor ---------- */
var mx=innerWidth/2,my=innerHeight/2;
addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;lastPt={x:mx/innerWidth,y:my/innerHeight};},{passive:true});
if(false){ /* cursor personalizado desativado: o cursor nativo responde sem atraso */
  body.classList.add('has-cursor');
  /* cursor simples: um anel pequeno que acompanha o mouse sem atraso e cresce levemente sobre itens clicáveis */
  var ring=$('curRing');
  ring.style.opacity=0;
  addEventListener('pointermove',function(e){ring.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';ring.style.opacity=1;},{passive:true});
  doc.addEventListener('pointerover',function(e){ ring.classList.toggle('hot',!!e.target.closest('a,button,[data-zoom],[data-goto],.pt,.wk-n')); });
  doc.addEventListener('pointerleave',function(){ring.style.opacity=0;});
  doc.addEventListener('pointerenter',function(){ring.style.opacity=1;});
}

/* ---------- ambient canvas ---------- */
(function(){
  var cv=$('bg'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W,H,P=[],n=lite?26:58,run=true;
  function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;}
  size();addEventListener('resize',size);
  for(var i=0;i<n;i++)P.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.1,v:.00006+Math.random()*.00022,ph:Math.random()*6.28,d:.2+Math.random()*.8});
  function draw(t){
    if(!run)return;ctx.clearRect(0,0,W,H);
    var dark=body.dataset.theme!=='light',ox=(mx/innerWidth-.5),oy=(my/innerHeight-.5);
    for(var i=0;i<P.length;i++){var p=P[i];
      if(!reduced){p.y-=p.v;if(p.y<-.05){p.y=1.05;p.x=Math.random();}}
      var x=(p.x+Math.sin(t*.0003+p.ph)*.012-ox*.02*p.d)*W,y=(p.y-oy*.02*p.d)*H;
      ctx.beginPath();ctx.arc(x,y,p.r*dpr,0,6.283);
      ctx.fillStyle=dark?'rgba(150,215,245,'+(.1+.32*p.d)+')':'rgba(0,75,133,'+(.06+.16*p.d)+')';ctx.fill();
    }
    if(!reduced&&!scrollMode)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  doc.addEventListener('visibilitychange',function(){run=!doc.hidden;if(run&&!reduced)requestAnimationFrame(draw);});
})();

/* ---------- fit mockups to their frames ---------- */
function fitMocks(){
  doc.querySelectorAll('.gal .frame').forEach(function(f){
    var m=f.querySelector('.mock');if(!m)return;
    var fw=f.clientWidth,fh=f.clientHeight,w=m.offsetWidth,h=m.offsetHeight;
    if(!fw||!fh||!w||!h)return;
    f.style.setProperty('--ms',Math.min(fw*.84/w,fh*.84/h,1.1).toFixed(3));
  });
}
var fitT=0;addEventListener('resize',function(){clearTimeout(fitT);fitT=setTimeout(fitMocks,120);});
var _onEnter=onEnter;onEnter=function(s){_onEnter(s);if(s.querySelector('.gal'))fitMocks();};

/* ---------- boot ---------- */
/* carrega as fontes de títulos e números antes de usá-las: evita a troca de fonte no meio de uma animação */
if(doc.fonts&&doc.fonts.load){['800 40px "Big Shoulders Display"','700 40px "Big Shoulders Display"','700 40px "Archivo"','800 40px "Archivo"','400 16px "Space Mono"'].forEach(function(f){try{doc.fonts.load(f);}catch(e){}});}
var start=0,h=(location.hash||'').match(/^#s(\d+)$/);if(h)start=Math.max(0,Math.min(N-1,parseInt(h[1],10)-1));
cur=start-1<0?-1:start-1;
if(mq.matches){applyMode();if(start>0)setTimeout(function(){slides[start].scrollIntoView();},80);}
else{cur=-1;slides.forEach(function(s){s.setAttribute('inert','');s.setAttribute('aria-hidden','true');});go(start,{instant:true});}
fitMocks();if(doc.fonts&&doc.fonts.ready)doc.fonts.ready.then(fitMocks);
if(mq.addEventListener)mq.addEventListener('change',applyMode);else if(mq.addListener)mq.addListener(applyMode);
})();
